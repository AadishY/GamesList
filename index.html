<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Steam Backlog Tracker</title>
    <!-- Sharp geometry font -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme = localStorage.getItem('steam-tracker-theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="text-black dark:text-white transition-colors duration-200" style="font-family: 'Space Grotesk', system-ui, sans-serif;">

    <div id="root">
      <style>
        .loader-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
        }
        .pulse-ring {
          width: 48px;
          height: 48px;
          border-radius: 50%;
          border: 4px solid #ff90e8;
          border-top-color: transparent;
          animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
      </style>
      <div class="loader-container">
        <div class="pulse-ring"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
