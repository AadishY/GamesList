<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Steam Backlog Tracker</title>
    <!-- Sharp geometry font -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme = localStorage.getItem('steam-tracker-theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="text-black dark:text-white transition-colors duration-200" style="font-family: 'Space Grotesk', system-ui, sans-serif;">
    <div id="root">
      <style>
        .loader-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family: 'Space Grotesk', system-ui, sans-serif;
          background-color: #fafafa;
          background-image: linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                            linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
          background-size: 30px 30px;
        }
        html.dark .loader-container {
          background-color: #111116;
          background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                            linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        }

        .loader-glass {
          display: flex;
          flex-direction: column;
          align-items: center;
          background: rgba(255, 255, 255, 0.7);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          border: 2px solid #000;
          box-shadow: 8px 8px 0px #000;
          border-radius: 1.5rem;
          padding: 3rem 4rem;
          position: relative;
        }
        html.dark .loader-glass {
          background: rgba(0, 0, 0, 0.5);
          border: 2px solid rgba(255, 255, 255, 0.2);
          box-shadow: 8px 8px 0px #fff;
        }

        .loader-btn {
          background: #fbdf3b; /* Neon Yellow */
          border: 2px solid #000;
          padding: 1rem;
          border-radius: 0.75rem;
          box-shadow: 4px 4px 0px #000;
          animation: hop 1.5s ease-in-out infinite;
          margin-bottom: 2rem;
        }
        html.dark .loader-btn {
          border-color: #fff;
          box-shadow: 4px 4px 0px #fff;
        }

        @keyframes hop {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }

        .loader-title {
          font-size: 1.75rem;
          font-weight: 800;
          letter-spacing: -0.05em;
          text-transform: uppercase;
          margin-bottom: 1rem;
        }

        .loader-bar-wrap {
          border: 2px solid #000;
          height: 12px;
          width: 200px;
          border-radius: 6px;
          overflow: hidden;
          background: rgba(0,0,0,0.05);
        }
        html.dark .loader-bar-wrap {
          border-color: #fff;
          background: rgba(255,255,255,0.05);
        }

        .loader-bar {
          background: #ff90e8; /* Pink */
          height: 100%;
          border-right: 2px solid #000;
          animation: fillup 1.5s ease-in-out infinite;
        }
        html.dark .loader-bar {
          border-right: 2px solid #fff;
        }

        @keyframes fillup {
          0% { width: 0%; }
          50% { width: 100%; }
          100% { width: 0%; transform: translateX(200px); }
        }
      </style>
      <div class="loader-container">
        <div class="loader-glass">
          <div class="loader-btn">
            <svg style="width: 32px; height: 32px; color: #000;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line><rect x="2" y="6" width="20" height="12" rx="2"></rect></svg>
          </div>
          <div class="loader-title">Steam Backlog</div>
          <div class="loader-bar-wrap">
            <div class="loader-bar"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
