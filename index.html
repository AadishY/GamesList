<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Steam Backlog Tracker — Organise Your Games in Style</title>
    <meta name="description" content="A premium, gaming-themed backlog tracker for Steam users. Track your collection with neon aesthetics and snapping interactions." />
    <!-- Preconnect for critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://api.rawg.io" />
    <link rel="preconnect" href="https://cdn.akamai.steamstatic.com" />
    <link rel="preconnect" href="https://media.rawg.io" />
    <!-- Sharp geometry font with swap for instant text rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme = localStorage.getItem('steam-tracker-theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="text-black dark:text-white transition-colors duration-200" style="font-family: 'Space Grotesk', system-ui, sans-serif;">

    <div id="root">
      <style>
        .loader-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          gap: 16px;
        }
        .loader-icon {
          font-size: 40px;
          animation: bounce-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .pulse-ring {
          width: 40px;
          height: 40px;
          border-radius: 50%;
          border: 3px solid #ec4899;
          border-top-color: transparent;
          animation: spin 0.8s linear infinite;
        }
        .loader-text {
          font-family: 'Space Grotesk', system-ui, sans-serif;
          font-size: 10px;
          font-weight: 900;
          text-transform: uppercase;
          letter-spacing: 0.2em;
          color: rgba(128,128,128,0.5);
          animation: fade-in 0.5s 0.3s both;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes bounce-in { 0% { opacity: 0; transform: scale(0.5); } 60% { transform: scale(1.1); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      </style>
      <div class="loader-container">
        <div class="loader-icon">🎮</div>
        <div class="pulse-ring"></div>
        <div class="loader-text">Loading</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
