name: Sync Co-Op API Data

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install xlsx
        
      - name: Fetch and Sync Data
        run: node scripts/sync-coop-api.js
        
      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add public/coopgames.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync co-op database to JSON API" && git push)
